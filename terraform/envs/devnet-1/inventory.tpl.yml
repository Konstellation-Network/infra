all:
  vars:
    ansible_user: deploy
    # Every connection goes through the bastion — see ssh_config next to this
    # file (also generated by terraform). Humans: `ssh -F ssh_config <host>`.
    ansible_ssh_common_args: "-F {{ inventory_dir }}/ssh_config"
    chain_id: devnet-1
    fleet_cidrs:
%{ for c in fleet_cidrs ~}
      - ${c}
%{ endfor ~}
    # single entry point = the only bastion, same cloud: nothing extra
    ssh_entry_bastion_private_ip: ""
    monitoring_host_private_ip: ${monitoring_host_private_ip}
    # One validator signing with its own priv_validator_key.json: no Horcrux
    # hosts or instances (README "devnet-1"). site.yml skips both horcrux plays.
    horcrux_mode: none
    # One cloud: no site-to-site WireGuard tunnel (site.yml skips roles/wireguard).
    cross_cloud_tunnel: false
  children:
    chain_nodes:
      children:
        validators:
        sentries:
        rpc:
        archive:
    validators:
      hosts:
%{ for name, v in validators ~}
        ${v.hostname}:
          ansible_host: ${v.private_ip}
          moniker: ${v.hostname}
          cloud: ${v.cloud}
          network_cidr: ${v.network_cidr}
          bastion_private_ip: ${v.bastion_private_ip}
%{ endfor ~}
    sentries:
      hosts:
%{ for name, s in sentries ~}
        ${s.hostname}:
          ansible_host: ${s.private_ip}
          public_ipv4: ${s.public_ipv4}
          moniker: ${s.hostname}
          cloud: ${s.cloud}
          network_cidr: ${s.network_cidr}
          bastion_private_ip: ${s.bastion_private_ip}
%{ endfor ~}
    rpc:
      hosts:
%{ for name, r in rpcs ~}
        ${r.hostname}:
          ansible_host: ${r.private_ip}
          public_ipv4: ${r.public_ipv4}
          cloud: ${r.cloud}
          network_cidr: ${r.network_cidr}
          bastion_private_ip: ${r.bastion_private_ip}
%{ endfor ~}
    archive:
      hosts:
%{ for name, a in archives ~}
        ${a.hostname}:
          ansible_host: ${a.private_ip}
          data_volume_device: ${a.data_volume_device}
          cloud: ${a.cloud}
          network_cidr: ${a.network_cidr}
          bastion_private_ip: ${a.bastion_private_ip}
%{ endfor ~}
    bastions:
      hosts:
        ${bastion.hostname}:
          # the entry bastion is reached directly on its public IP; ssh_config
          # has a direct Host block for it (no ProxyJump), so -F still applies
          ansible_host: ${bastion.public_ipv4}
          public_ipv4: ${bastion.public_ipv4}
          private_ip: ${bastion.private_ip}
          cloud: hetzner
          network_cidr: ${bastion.network_cidr}
          ssh_entry: true
          operator_ssh_cidrs:
%{ for c in bastion.operator_ssh_cidrs ~}
            - ${c}
%{ endfor ~}
          nat_gateway: true
          remote_cidrs: []
    monitoring:
      hosts:
%{ for name, m in monitoring ~}
        ${m.hostname}:
          ansible_host: ${m.private_ip}
          data_volume_device: ${m.data_volume_device}
          cloud: ${m.cloud}
          network_cidr: ${m.network_cidr}
          bastion_private_ip: ${m.bastion_private_ip}
%{ endfor ~}
    cosigners:
      hosts:
