all:
  vars:
    ansible_user: deploy
    # Every connection goes through a bastion — see ssh_config next to this
    # file (also generated by terraform). Humans: `ssh -F ssh_config <host>`.
    ansible_ssh_common_args: "-F {{ inventory_dir }}/ssh_config"
    chain_id: testnet-1
    fleet_cidrs:
%{ for c in fleet_cidrs ~}
      - ${c}
%{ endfor ~}
    # empty with bastion_ssh_entry = per-cloud
    ssh_entry_bastion_private_ip: "${ssh_entry_bastion_private_ip}"
    monitoring_host_private_ip: ${monitoring_host_private_ip}
    horcrux_mode: ${horcrux_mode}
    wireguard_cidr: ${wireguard_cidr}
    wireguard_port: ${wireguard_port}
  children:
    chain_nodes:
      children:
        validators:
        sentries:
        rpc:
        archive:
    validators:
      hosts:
%{ for name, v in validators ~}
        ${v.hostname}:
          ansible_host: ${v.private_ip}
          moniker: ${v.hostname}
          cloud: ${v.cloud}
          network_cidr: ${v.network_cidr}
          bastion_private_ip: ${v.bastion_private_ip}
%{ if v.local_ssd_count > 0 ~}
          local_ssd_count: ${v.local_ssd_count}
%{ endif ~}
%{ endfor ~}
    sentries:
      hosts:
%{ for name, s in sentries ~}
        ${s.hostname}:
          ansible_host: ${s.private_ip}
          public_ipv4: ${s.public_ipv4}
          moniker: ${s.hostname}
          cloud: ${s.cloud}
          network_cidr: ${s.network_cidr}
          bastion_private_ip: ${s.bastion_private_ip}
%{ endfor ~}
    rpc:
      hosts:
%{ for name, r in rpcs ~}
        ${r.hostname}:
          ansible_host: ${r.private_ip}
          public_ipv4: ${r.public_ipv4}
          cloud: ${r.cloud}
          network_cidr: ${r.network_cidr}
          bastion_private_ip: ${r.bastion_private_ip}
%{ endfor ~}
    archive:
      hosts:
%{ for name, a in archives ~}
        ${a.hostname}:
          ansible_host: ${a.private_ip}
          data_volume_device: ${a.data_volume_device}
          cloud: ${a.cloud}
          network_cidr: ${a.network_cidr}
          bastion_private_ip: ${a.bastion_private_ip}
%{ endfor ~}
    bastions:
      hosts:
%{ for name, b in bastions ~}
        ${b.hostname}:
%{ if b.ssh_entry ~}
          # an entry bastion is reached directly on its public IP, not via ProxyJump
          ansible_host: ${b.public_ipv4}
          ansible_ssh_common_args: ""
%{ else ~}
          # not an entry point: reached on its private IP through the entry bastion and the tunnel
          ansible_host: ${b.private_ip}
%{ endif ~}
          public_ipv4: ${b.public_ipv4}
          private_ip: ${b.private_ip}
          cloud: ${b.cloud}
          network_cidr: ${b.network_cidr}
          ssh_entry: ${b.ssh_entry}
%{ if length(b.operator_ssh_cidrs) == 0 ~}
          operator_ssh_cidrs: []
%{ else ~}
          operator_ssh_cidrs:
%{ for c in b.operator_ssh_cidrs ~}
            - ${c}
%{ endfor ~}
%{ endif ~}
          nat_gateway: ${b.nat_gateway}
          wireguard_address: ${b.wireguard_address}
          wireguard_peer: ${b.wireguard_peer}
          wireguard_endpoint: ${b.wireguard_endpoint}
          remote_cidrs:
%{ for c in b.remote_cidrs ~}
            - ${c}
%{ endfor ~}
%{ endfor ~}
    monitoring:
      hosts:
%{ for name, m in monitoring ~}
        ${m.hostname}:
          ansible_host: ${m.private_ip}
          data_volume_device: ${m.data_volume_device}
          cloud: ${m.cloud}
          network_cidr: ${m.network_cidr}
          bastion_private_ip: ${m.bastion_private_ip}
%{ endfor ~}
    cosigners:
      hosts:
%{ for name, c in cosigners ~}
        ${c.hostname}:
          ansible_host: ${c.private_ip}
          shard_id: ${c.shard_id}
          cloud: ${c.cloud}
          network_cidr: ${c.network_cidr}
          bastion_private_ip: ${c.bastion_private_ip}
%{ endfor ~}
