---
# Fixture for tests/render_test.yml: the default topology with horcrux_mode =
# dedicated and every host present, so every template path renders. Keep in
# step with terraform/envs/testnet-1/inventory.tpl.yml; group_vars is a
# symlink to the real testnet-1 group_vars so drift there is caught too.
all:
  vars:
    ansible_user: deploy
    # Every connection goes through a bastion — see ssh_config next to this
    # file (also generated by terraform). Humans: `ssh -F ssh_config <host>`.
    ansible_ssh_common_args: "-F {{ inventory_dir }}/ssh_config"
    chain_id: testnet-1
    fleet_cidrs:
      - 10.0.1.0/24
      - 10.0.2.0/24
    # empty with bastion_ssh_entry = per-cloud
    ssh_entry_bastion_private_ip: "10.0.1.5"
    monitoring_host_private_ip: 10.0.2.50
    horcrux_mode: dedicated
    wireguard_cidr: 10.0.9.0/24
    wireguard_port: 51820
  children:
    chain_nodes:
      children:
        validators:
        sentries:
        rpc:
        archive:
    validators:
      hosts:
        testnet-1-hetzner-validator-v1:
          ansible_host: 10.0.1.11
          moniker: testnet-1-hetzner-validator-v1
          cloud: hetzner
          network_cidr: 10.0.1.0/24
          bastion_private_ip: 10.0.1.5
        testnet-1-hetzner-validator-v2:
          ansible_host: 10.0.1.12
          moniker: testnet-1-hetzner-validator-v2
          cloud: hetzner
          network_cidr: 10.0.1.0/24
          bastion_private_ip: 10.0.1.5
        testnet-1-hetzner-validator-v3:
          ansible_host: 10.0.1.13
          moniker: testnet-1-hetzner-validator-v3
          cloud: hetzner
          network_cidr: 10.0.1.0/24
          bastion_private_ip: 10.0.1.5
        testnet-1-hetzner-validator-v4:
          ansible_host: 10.0.1.14
          moniker: testnet-1-hetzner-validator-v4
          cloud: hetzner
          network_cidr: 10.0.1.0/24
          bastion_private_ip: 10.0.1.5
        testnet-1-hetzner-validator-v5:
          ansible_host: 10.0.1.15
          moniker: testnet-1-hetzner-validator-v5
          cloud: hetzner
          network_cidr: 10.0.1.0/24
          bastion_private_ip: 10.0.1.5
        testnet-1-gcp-validator-v6:
          ansible_host: 10.0.2.16
          moniker: testnet-1-gcp-validator-v6
          cloud: gcp
          network_cidr: 10.0.2.0/24
          bastion_private_ip: 10.0.2.5
          local_ssd_count: 8
        testnet-1-gcp-validator-v7:
          ansible_host: 10.0.2.17
          moniker: testnet-1-gcp-validator-v7
          cloud: gcp
          network_cidr: 10.0.2.0/24
          bastion_private_ip: 10.0.2.5
          local_ssd_count: 8
        testnet-1-gcp-validator-v8:
          ansible_host: 10.0.2.18
          moniker: testnet-1-gcp-validator-v8
          cloud: gcp
          network_cidr: 10.0.2.0/24
          bastion_private_ip: 10.0.2.5
          local_ssd_count: 8
        testnet-1-gcp-validator-v9:
          ansible_host: 10.0.2.19
          moniker: testnet-1-gcp-validator-v9
          cloud: gcp
          network_cidr: 10.0.2.0/24
          bastion_private_ip: 10.0.2.5
          local_ssd_count: 8
        testnet-1-gcp-validator-v10:
          ansible_host: 10.0.2.20
          moniker: testnet-1-gcp-validator-v10
          cloud: gcp
          network_cidr: 10.0.2.0/24
          bastion_private_ip: 10.0.2.5
          local_ssd_count: 8
    sentries:
      hosts:
        testnet-1-hetzner-sentry-v1:
          ansible_host: 10.0.1.21
          public_ipv4: 203.0.113.21
          moniker: testnet-1-hetzner-sentry-v1
          cloud: hetzner
          network_cidr: 10.0.1.0/24
          bastion_private_ip: 10.0.1.5
    rpc:
      hosts:
        testnet-1-gcp-rpc-1:
          ansible_host: 10.0.2.31
          public_ipv4: 198.51.100.31
          cloud: gcp
          network_cidr: 10.0.2.0/24
          bastion_private_ip: 10.0.2.5
    archive:
      hosts:
        testnet-1-hetzner-archive-1:
          ansible_host: 10.0.1.41
          data_volume_device: /dev/disk/by-id/scsi-0HC_Volume_12345
          cloud: hetzner
          network_cidr: 10.0.1.0/24
          bastion_private_ip: 10.0.1.5
    bastions:
      hosts:
        testnet-1-gcp-bastion:
          # not an entry point: reached on its private IP through the entry bastion and the tunnel
          ansible_host: 10.0.2.5
          public_ipv4: 198.51.100.5
          private_ip: 10.0.2.5
          cloud: gcp
          network_cidr: 10.0.2.0/24
          ssh_entry: false
          operator_ssh_cidrs: []
          nat_gateway: false
          wireguard_address: 10.0.9.2
          wireguard_peer: testnet-1-hetzner-bastion
          wireguard_endpoint: 203.0.113.5
          remote_cidrs:
            - 10.0.1.0/24
        testnet-1-hetzner-bastion:
          # an entry bastion is reached directly on its public IP, not via ProxyJump
          ansible_host: 203.0.113.5
          public_ipv4: 203.0.113.5
          private_ip: 10.0.1.5
          cloud: hetzner
          network_cidr: 10.0.1.0/24
          ssh_entry: true
          operator_ssh_cidrs:
            - 203.0.113.10/32
          nat_gateway: true
          wireguard_address: 10.0.9.1
          wireguard_peer: testnet-1-gcp-bastion
          wireguard_endpoint: 198.51.100.5
          remote_cidrs:
            - 10.0.2.0/24
    monitoring:
      hosts:
        testnet-1-gcp-monitoring-1:
          ansible_host: 10.0.2.50
          data_volume_device: /dev/disk/by-id/google-data
          cloud: gcp
          network_cidr: 10.0.2.0/24
          bastion_private_ip: 10.0.2.5
    cosigners:
      hosts:
        testnet-1-gcp-cosigner-c2:
          ansible_host: 10.0.2.62
          shard_id: 2
          cloud: gcp
          network_cidr: 10.0.2.0/24
          bastion_private_ip: 10.0.2.5
        testnet-1-hetzner-cosigner-c3:
          ansible_host: 10.0.1.63
          shard_id: 3
          cloud: hetzner
          network_cidr: 10.0.1.0/24
          bastion_private_ip: 10.0.1.5
        testnet-1-hetzner-cosigner-c1:
          ansible_host: 10.0.1.61
          shard_id: 1
          cloud: hetzner
          network_cidr: 10.0.1.0/24
          bastion_private_ip: 10.0.1.5
