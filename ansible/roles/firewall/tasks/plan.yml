---
# Compute this host's ufw rule set as data (`firewall_rules`), without
# touching ufw. tasks/main.yml applies it; ansible/tests/devnet_render_test.yml
# imports exactly this file and asserts on the result, so what a host
# admits is testable on the controller.
#
# A host may hold several roles (devnet-1 on Contabo: server 2 is bastion +
# sentry + rpc, server 3 is archive + monitoring). The rule set is the
# UNION of the rules of every role group the host is in, plus node_role.
# group_vars cannot express that on their own: when a host is in several
# groups, one group's `node_role` silently wins (alphabetical order), so
# e.g. a sentry that is also the bastion would otherwise lose the operator
# SSH rule and lock everyone out. On testnet-1 every host is in exactly
# one role group, so the union is [node_role] and nothing changes.

- name: Collect this host's roles from its groups
  ansible.builtin.set_fact:
    fw_roles: >-
      {{ ([node_role] + (group_names | select('in', firewall_group_roles) | map('extract', firewall_group_roles) | list)) | unique }}
    firewall_rules: []

# ENGINEERING.md §9.2 / §2.7: a validator has no public face. Sharing its
# host with a sentry, rpc, archive, bastion or monitoring role would put
# public (or operator) listeners next to the consensus key.
- name: Fail if a validator shares its host with any other role
  when: "'validator' in fw_roles"
  ansible.builtin.assert:
    that:
      - fw_roles == ['validator']
    fail_msg: "{{ inventory_hostname }} is a validator and also {{ fw_roles | reject('==', 'validator') | list }} — a validator host holds no other role."

- name: Fail if bastion_private_ip is unset (non-bastion hosts)
  when: "'bastion' not in fw_roles"
  ansible.builtin.assert:
    that:
      - bastion_private_ip | length > 0
    fail_msg: "bastion_private_ip must be set — refusing to leave SSH unrestricted."

- name: Fail if operator_ssh_cidrs is unset while this bastion is an SSH entry point
  when: "'bastion' in fw_roles and (ssh_entry | default(false) | bool)"
  ansible.builtin.assert:
    that:
      - operator_ssh_cidrs | length > 0
      - "'0.0.0.0/0' not in operator_ssh_cidrs"
      - "'::/0' not in operator_ssh_cidrs"
    fail_msg: "operator_ssh_cidrs must list specific CIDRs — refusing to expose sshd to the internet."

- name: Fail if network_cidr / fleet_cidrs are unset (private-network fleets)
  when: private_network | bool
  ansible.builtin.assert:
    that:
      - network_cidr | length > 0
      - fleet_cidrs | length > 0
    fail_msg: >-
      network_cidr and fleet_cidrs must be set by terraform's inventory output
      (Hetzner and GCP have separate private networks) — refusing to guess.

# private_network: false (devnet-1 on Contabo) — every host has only a
# public IPv4, so every "internal" source below is a public address and
# the only thing standing between it and the internet is this rule set.
# Hence: exact /32s only, and none of the private-network machinery.
- name: Fail if a public-IP fleet uses anything wider than a single address as an internal source
  when: not (private_network | bool)
  ansible.builtin.assert:
    that:
      - fleet_cidrs | length > 0
      - metrics_scrape_cidrs | length > 0
      - (fleet_cidrs + metrics_scrape_cidrs) | reject('match', '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/32$') | list | length == 0
      - monitoring_host_private_ip is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
      - "'bastion' in fw_roles or bastion_private_ip is match('^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$')"
    fail_msg: >-
      private_network is false: fleet_cidrs and metrics_scrape_cidrs must be
      public /32s, and bastion_private_ip / monitoring_host_private_ip single
      addresses (they hold the entry host's and the monitoring host's PUBLIC
      IPs on such a network) — refusing to open an internal port to a range.

- name: Fail if a bastion on a public-IP fleet is configured as a router
  when: "not (private_network | bool) and 'bastion' in fw_roles"
  ansible.builtin.assert:
    that:
      - not (nat_gateway | bool)
      - remote_cidrs | length == 0
      - wireguard_endpoint | length == 0
    fail_msg: "private_network is false: there is no private network to NAT or tunnel — nat_gateway must be false, remote_cidrs and wireguard_endpoint empty."

# --- SSH ---

- name: Plan SSH from this cloud's bastion only
  when: "'bastion' not in fw_roles"
  ansible.builtin.set_fact:
    firewall_rules: "{{ firewall_rules + [{'port': ssh_port | string, 'proto': 'tcp', 'src': bastion_private_ip, 'comment': 'ssh from bastion'}] }}"

- name: Plan SSH from the entry bastion across the tunnel (single-entry topology)
  when: "'bastion' not in fw_roles and (ssh_entry_bastion_private_ip | default('') | length > 0)"
  ansible.builtin.set_fact:
    firewall_rules: "{{ firewall_rules + [{'port': ssh_port | string, 'proto': 'tcp', 'src': ssh_entry_bastion_private_ip, 'comment': 'ssh from entry bastion'}] }}"

- name: Plan operator SSH to the bastion
  when: "'bastion' in fw_roles and (ssh_entry | default(false) | bool)"
  ansible.builtin.set_fact:
    firewall_rules: "{{ firewall_rules + [{'port': ssh_port | string, 'proto': 'tcp', 'src': item, 'comment': 'ssh from operators'}] }}"
  loop: "{{ operator_ssh_cidrs }}"

# A non-entry bastion still needs to be reachable by Ansible: through the
# tunnel, from the entry bastion's private network.
- name: Plan SSH to a non-entry bastion from the other cloud's private network
  when: "'bastion' in fw_roles and not (ssh_entry | default(false) | bool)"
  ansible.builtin.set_fact:
    firewall_rules: "{{ firewall_rules + [{'port': ssh_port | string, 'proto': 'tcp', 'src': item, 'comment': 'ssh across tunnel'}] }}"
  loop: "{{ remote_cidrs }}"

# --- Metrics (every host runs node_exporter; chain nodes also expose CometBFT metrics) ---

- name: Plan node_exporter scrape from the metrics sources
  ansible.builtin.set_fact:
    firewall_rules: "{{ firewall_rules + [{'port': node_exporter_port | string, 'proto': 'tcp', 'src': item, 'comment': 'node_exporter scrape'}] }}"
  loop: "{{ metrics_scrape_cidrs }}"

- name: Plan CometBFT prometheus scrape from the metrics sources — chain nodes
  when: fw_roles | intersect(['validator', 'sentry', 'rpc', 'archive']) | length > 0
  ansible.builtin.set_fact:
    firewall_rules: "{{ firewall_rules + [{'port': prometheus_port | string, 'proto': 'tcp', 'src': item, 'comment': 'cometbft metrics scrape'}] }}"
  loop: "{{ metrics_scrape_cidrs }}"

# --- Chain traffic ---

# Validators take p2p from their own cloud's sentries only — not the /24,
# which includes the internet-facing RPC node (P23 interim, 2026-09-21).
# On a public-IP fleet the sentry's ansible_host is its public /32.
- name: Plan p2p (26656) from the same-cloud sentries only — validators
  when: "'validator' in fw_roles"
  ansible.builtin.set_fact:
    firewall_rules: "{{ firewall_rules + [{'port': '26656', 'proto': 'tcp', 'src': hostvars[item]['ansible_host'], 'comment': 'p2p from own sentry'}] }}"
  loop: "{{ groups['sentries'] | default([]) | select('in', same_cloud_sentry_hosts) | list }}"
  vars:
    same_cloud_sentry_hosts: "{{ hostvars | dict2items | selectattr('value.cloud', 'defined') | selectattr('value.cloud', '==', cloud) | map(attribute='key') | list }}"

- name: Fail if a validator has no same-cloud sentry to take p2p from
  when: "'validator' in fw_roles"
  ansible.builtin.assert:
    that:
      - groups['sentries'] | default([]) | map('extract', hostvars) | selectattr('cloud', 'defined') | selectattr('cloud', '==', cloud) | list | length > 0
    fail_msg: "{{ inventory_hostname }} has no sentry in cloud {{ cloud }} — it would have no p2p path at all."

- name: Plan p2p (26656) from anywhere — sentries and rpc
  when: fw_roles | intersect(['sentry', 'rpc']) | length > 0
  ansible.builtin.set_fact:
    firewall_rules: "{{ firewall_rules + [{'port': '26656', 'proto': 'tcp', 'comment': 'p2p public'}] }}"

- name: Plan CometBFT RPC (26657) from the monitoring host — sentries (tenderduty)
  when: "'sentry' in fw_roles"
  ansible.builtin.set_fact:
    firewall_rules: "{{ firewall_rules + [{'port': '26657', 'proto': 'tcp', 'src': monitoring_host_private_ip, 'comment': 'cometbft rpc for tenderduty'}] }}"

- name: Plan public RPC/REST/JSON-RPC ports — rpc only
  when: "'rpc' in fw_roles"
  ansible.builtin.set_fact:
    firewall_rules: "{{ firewall_rules + [{'port': item, 'proto': 'tcp', 'comment': 'public rpc'}] }}"
  loop:
    - "26657"
    - "1317"
    - "8545:8546"

- name: Fail if an archive RPC source is wider than a /24
  when: "'archive' in fw_roles"
  ansible.builtin.assert:
    that:
      - archive_rpc_allowed_cidrs | length > 0
      - archive_rpc_allowed_cidrs | reject('match', '^[0-9.]+/(2[4-9]|3[0-2])$') | list | length == 0
    fail_msg: "archive_rpc_allowed_cidrs must be non-empty IPv4 prefixes of /24 or narrower (the archive's debug JSON-RPC is never opened wider)."

# 26657 for the monitoring host (tenderduty) and the explorer; REST and the
# debug-enabled JSON-RPC for the explorer only (review, 2026-09-21).
- name: Plan CometBFT RPC (26657) from the monitoring host and the explorer — archive only
  when: "'archive' in fw_roles"
  ansible.builtin.set_fact:
    firewall_rules: "{{ firewall_rules + [{'port': '26657', 'proto': 'tcp', 'src': item, 'comment': 'archive cometbft rpc'}] }}"
  loop: "{{ archive_rpc_allowed_cidrs }}"

- name: Plan REST/JSON-RPC (1317, 8545-8546) from the explorer only — archive only
  when: "'archive' in fw_roles"
  ansible.builtin.set_fact:
    firewall_rules: "{{ firewall_rules + [{'port': item.0, 'proto': 'tcp', 'src': item.1, 'comment': 'archive rest/json-rpc for explorer'}] }}"
  loop: "{{ ['1317', '8545:8546'] | product(archive_explorer_cidrs) | list }}"

# --- Horcrux, dedicated mode: cosigners dial validators' priv_validator_laddr
#     and each other's raft/grpc port. Exact cosigner IPs, not CIDRs. ---

- name: Plan priv_validator_laddr from the cosigners — validators, dedicated horcrux
  when: "'validator' in fw_roles and horcrux_mode == 'dedicated'"
  ansible.builtin.set_fact:
    firewall_rules: "{{ firewall_rules + [{'port': horcrux_privval_port | string, 'proto': 'tcp', 'src': hostvars[item]['ansible_host'], 'comment': 'horcrux privval'}] }}"
  loop: "{{ groups['cosigners'] | default([]) }}"

- name: Plan horcrux metrics (debugAddr) from the monitoring host — cosigners
  when: "'cosigner' in fw_roles"
  ansible.builtin.set_fact:
    firewall_rules: >-
      {{ firewall_rules + [{'port': (horcrux_debug_base_port | string) ~ ':' ~ ((horcrux_debug_base_port + (groups['validators'] | length) - 1) | string),
                            'proto': 'tcp', 'src': monitoring_host_private_ip, 'comment': 'horcrux metrics'}] }}

- name: Plan cosigner-to-cosigner raft/grpc — cosigners
  when: "'cosigner' in fw_roles"
  ansible.builtin.set_fact:
    firewall_rules: >-
      {{ firewall_rules + [{'port': (horcrux_p2p_base_port | string) ~ ':' ~ ((horcrux_p2p_base_port + (groups['validators'] | length) - 1) | string),
                            'proto': 'tcp', 'src': hostvars[item]['ansible_host'], 'comment': 'horcrux p2p'}] }}
  loop: "{{ groups['cosigners'] | default([]) | difference([inventory_hostname]) }}"

# --- Bastion: tunnel endpoint + router ---

- name: Plan WireGuard from the peer bastion only
  when: "'bastion' in fw_roles and wireguard_endpoint | length > 0"
  ansible.builtin.set_fact:
    firewall_rules: "{{ firewall_rules + [{'port': wireguard_port | string, 'proto': 'udp', 'src': wireguard_endpoint, 'comment': 'wireguard peer'}] }}"

- name: Plan routed traffic between this private network and the tunnel
  when: "'bastion' in fw_roles"
  ansible.builtin.set_fact:
    firewall_rules: "{{ firewall_rules + [{'route': true, 'src': item.0, 'dest': item.1, 'comment': 'route via tunnel'}] }}"
  loop: "{{ ([network_cidr] | product(remote_cidrs) | list) + (remote_cidrs | product([network_cidr]) | list) }}"

- name: Plan routed egress from the private network to the internet (NAT gateway)
  when: "'bastion' in fw_roles and (nat_gateway | bool)"
  ansible.builtin.set_fact:
    firewall_rules: "{{ firewall_rules + [{'route': true, 'src': network_cidr, 'comment': 'nat egress'}] }}"
