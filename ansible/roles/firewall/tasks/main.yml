---
# Host-level ufw for every host in the fleet, mirroring the cloud firewalls
# in terraform/envs/testnet-1's hetzner.tf/gcp.tf. Deliberately redundant
# with them: two independent layers that both have to fail open for a host
# to be reachable it shouldn't be. On Hetzner this layer is not redundant
# but PRIMARY for private-network traffic — hcloud firewalls only filter
# the public interface, and validators/archive/monitoring/cosigners have
# none (see hetzner.tf header). On devnet-1 (Contabo, private_network:
# false) it is the ONLY network control: no cloud firewall, no private
# network.
#
# The rules are computed first (tasks/plan.yml — also what the render
# tests assert on) and then applied here, so a failing assert in the plan
# stops the play before ufw is touched.

- name: Compute the rule set (tasks/plan.yml)
  ansible.builtin.import_tasks: plan.yml

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Apply the planned rules
  community.general.ufw:
    rule: allow
    route: "{{ item.route | default(false) }}"
    port: "{{ item.port | default(omit) }}"
    proto: "{{ item.proto | default(omit) }}"
    src: "{{ item.src | default(omit) }}"
    dest: "{{ item.dest | default(omit) }}"
    comment: "{{ item.comment }}"
  loop: "{{ firewall_rules }}"
  loop_control:
    label: "{{ item.comment }}: {{ item.port | default('route') }}/{{ item.proto | default('any') }} from {{ item.src | default('anywhere') }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled
