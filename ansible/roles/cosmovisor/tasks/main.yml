---
# Cosmovisor with auto-download OFF (ENGINEERING.md §9.2): every upgrade binary
# is staged by hand into cosmovisor/upgrades/<name>/bin/ by ansible/upgrade.yml
# after checksum verification, never pulled automatically from a governance
# proposal's upgrade-info.json.

- name: Fail if cosmovisor_sha256 is unset
  ansible.builtin.assert:
    that:
      - cosmovisor_sha256 | length > 0
    fail_msg: "cosmovisor_sha256 must be set — never install cosmovisor unverified."

- name: Root-owned download cache (never /tmp — a pre-existing file there could be swapped between download and extract)
  ansible.builtin.file:
    path: /var/cache/konstellation
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Download and verify the cosmovisor tarball {{ cosmovisor_version }}
  ansible.builtin.get_url:
    url: "{{ cosmovisor_release_url }}"
    dest: /var/cache/konstellation/cosmovisor.tar.gz
    force: true  # always re-fetch into the root-only cache; the checksum below is what gates extraction
    owner: root
    group: root
    checksum: "sha256:{{ cosmovisor_sha256 }}"
    mode: "0644"

- name: Re-verify the cached tarball immediately before extracting as root
  ansible.builtin.stat:
    path: /var/cache/konstellation/cosmovisor.tar.gz
    checksum_algorithm: sha256
  register: cosmovisor_tarball

- name: Fail if the tarball changed between download and extract
  ansible.builtin.assert:
    that:
      - cosmovisor_tarball.stat.checksum == cosmovisor_sha256
    fail_msg: "cosmovisor tarball checksum mismatch at extract time — refusing."

- name: Extract cosmovisor binary
  ansible.builtin.unarchive:
    src: /var/cache/konstellation/cosmovisor.tar.gz
    dest: /usr/local/bin
    remote_src: true
    extra_opts: ["cosmovisor"]
    owner: root
    group: root
    mode: "0755"
  notify: Reload systemd and restart cosmovisor

- name: Install cosmovisor systemd unit (tasks/unit.yml)
  ansible.builtin.import_tasks: unit.yml

- name: Enable cosmovisor at boot
  ansible.builtin.systemd:
    name: cosmovisor.service
    enabled: true
    daemon_reload: true
