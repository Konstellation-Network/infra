---
- name: Fail if checksums are unset
  ansible.builtin.assert:
    that:
      - prometheus_sha256 | length > 0
      - alertmanager_sha256 | length > 0
    fail_msg: "prometheus_sha256 and alertmanager_sha256 must be set — never install unverified."

- name: Fail on a port collision (tasks/port_guard.yml)
  ansible.builtin.import_tasks: port_guard.yml

- name: Fail if tenderduty is not pinned by digest
  when: tenderduty_require_digest | bool
  ansible.builtin.assert:
    that:
      - tenderduty_image_digest is match('^sha256:[0-9a-f]{64}$')
    fail_msg: "tenderduty_image_digest must be a sha256:<64 hex> digest (tenderduty_require_digest is on by default; never deploy the pager from a floating tag)."

- name: Warn about validator entries with no valoper address
  when: item.valoper | default('') | length == 0
  ansible.builtin.debug:
    msg: "WARNING: tenderduty_validators entry {{ item.name }} has no valoper — skipped. Fill it in once the gentx exists."
  loop: "{{ tenderduty_validators }}"

# --- data volume ---

- name: Mount the data volume, if this host has one
  when: data_volume_device | length > 0
  block:
    - name: Format data volume (only if it has no filesystem yet)
      community.general.filesystem:
        fstype: ext4
        dev: "{{ data_volume_device }}"

    - name: Mount data volume at {{ monitoring_data_dir }}
      ansible.posix.mount:
        path: "{{ monitoring_data_dir }}"
        src: "{{ data_volume_device }}"
        fstype: ext4
        opts: defaults,nofail
        state: mounted

- name: Create service users
  ansible.builtin.user:
    name: "{{ item }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  loop:
    - prometheus
    - alertmanager

- name: Create the tenderduty user with the container's uid
  ansible.builtin.user:
    name: tenderduty
    uid: "{{ tenderduty_uid }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Fail if the mainnet monitoring host has no alert route
  when: chain_id == 'konstellation-1'
  ansible.builtin.assert:
    that:
      - (alert_pagerduty_routing_key | length > 0) or (alert_slack_webhook_url | length > 0)
        or (alert_webhook_url | length > 0) or (alert_discord_webhook_url | length > 0)
        or (alert_telegram_api_key | length > 0)
    fail_msg: >-
      chain_id is konstellation-1 but every alert_* route is empty — the
      placeholder Alertmanager/tenderduty routing would page nobody. Set at
      least one from the vault (runbooks/on-call.md) before deploying mainnet monitoring.

- name: Create directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0750"
  loop:
    - { path: /etc/prometheus, owner: prometheus }
    - { path: "{{ monitoring_data_dir }}/prometheus", owner: prometheus }
    - { path: /etc/alertmanager, owner: alertmanager }
    - { path: "{{ monitoring_data_dir }}/alertmanager", owner: alertmanager }
    - { path: "{{ tenderduty_dir }}", owner: tenderduty }
    - { path: "{{ monitoring_data_dir }}/tenderduty", owner: tenderduty }

# --- prometheus ---

- name: Root-owned download cache (never /tmp — a pre-existing file there could be swapped between download and extract)
  ansible.builtin.file:
    path: /var/cache/konstellation
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Download prometheus, verify sha256
  ansible.builtin.get_url:
    url: "{{ prometheus_release_url }}"
    dest: /var/cache/konstellation/prometheus.tar.gz
    force: true  # always re-fetch into the root-only cache; the checksum below is what gates extraction
    owner: root
    group: root
    checksum: "sha256:{{ prometheus_sha256 }}"
    mode: "0644"

- name: Re-verify the cached prometheus tarball immediately before extracting as root
  ansible.builtin.stat:
    path: /var/cache/konstellation/prometheus.tar.gz
    checksum_algorithm: sha256
  register: prometheus_tarball

- name: Fail if the prometheus tarball changed between download and extract
  ansible.builtin.assert:
    that:
      - prometheus_tarball.stat.checksum == prometheus_sha256
    fail_msg: "prometheus tarball checksum mismatch at extract time — refusing."

- name: Extract prometheus + promtool
  ansible.builtin.unarchive:
    src: /var/cache/konstellation/prometheus.tar.gz
    dest: /usr/local/bin
    remote_src: true
    extra_opts:
      - "--strip-components=1"
      - "prometheus-{{ prometheus_version }}.linux-amd64/prometheus"
      - "prometheus-{{ prometheus_version }}.linux-amd64/promtool"
    owner: root
    group: root
    mode: "0755"
  notify: Restart prometheus

# The alert rules are the repo's monitoring/prometheus/alerts.yml — one
# file, reviewed in PRs, deployed verbatim. Do not template a second copy.
- name: Deploy alert rules from monitoring/prometheus/alerts.yml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../monitoring/prometheus/alerts.yml"
    dest: /etc/prometheus/alerts.yml
    owner: prometheus
    group: prometheus
    mode: "0640"
    validate: "/usr/local/bin/promtool check rules %s"
  notify: Reload prometheus

- name: Download alertmanager, verify sha256
  ansible.builtin.get_url:
    url: "{{ alertmanager_release_url }}"
    dest: /var/cache/konstellation/alertmanager.tar.gz
    force: true  # always re-fetch into the root-only cache; the checksum below is what gates extraction
    owner: root
    group: root
    checksum: "sha256:{{ alertmanager_sha256 }}"
    mode: "0644"

- name: Re-verify the cached alertmanager tarball immediately before extracting as root
  ansible.builtin.stat:
    path: /var/cache/konstellation/alertmanager.tar.gz
    checksum_algorithm: sha256
  register: alertmanager_tarball

- name: Fail if the alertmanager tarball changed between download and extract
  ansible.builtin.assert:
    that:
      - alertmanager_tarball.stat.checksum == alertmanager_sha256
    fail_msg: "alertmanager tarball checksum mismatch at extract time — refusing."

- name: Extract alertmanager + amtool
  ansible.builtin.unarchive:
    src: /var/cache/konstellation/alertmanager.tar.gz
    dest: /usr/local/bin
    remote_src: true
    extra_opts:
      - "--strip-components=1"
      - "alertmanager-{{ alertmanager_version }}.linux-amd64/alertmanager"
      - "alertmanager-{{ alertmanager_version }}.linux-amd64/amtool"
    owner: root
    group: root
    mode: "0755"
  notify: Restart alertmanager

- name: Render prometheus.yml, alertmanager.yml, tenderduty config + unit (tasks/configs.yml)
  ansible.builtin.import_tasks: configs.yml

- name: Install prometheus systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart prometheus

- name: Enable and start prometheus
  ansible.builtin.systemd:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true

# --- alertmanager ---

- name: Install alertmanager systemd unit
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart alertmanager

- name: Enable and start alertmanager
  ansible.builtin.systemd:
    name: alertmanager
    enabled: true
    state: started
    daemon_reload: true

# --- grafana ---

- name: Install grafana apt signing key
  ansible.builtin.shell: |
    set -o pipefail
    install -d -m 0755 /etc/apt/keyrings
    curl -fsSL {{ grafana_apt_key_url }} | gpg --dearmor -o /etc/apt/keyrings/grafana.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/grafana.gpg

# The key came over TLS from grafana.com — same origin as the packages it
# signs, so on its own it proves nothing. Pin the fingerprint recorded
# out of band (grafana_apt_key_fingerprint, from Grafana's docs page, not
# from the key file) and refuse to proceed if it differs.
- name: Read the installed grafana key fingerprint
  ansible.builtin.shell: |
    set -o pipefail
    gpg --show-keys --with-colons /etc/apt/keyrings/grafana.gpg | awk -F: '$1=="fpr"{print $10; exit}'
  args:
    executable: /bin/bash
  register: grafana_key_fpr
  changed_when: false

- name: Fail if the grafana key fingerprint is not the pinned one
  ansible.builtin.assert:
    that:
      - grafana_apt_key_fingerprint | length > 0
      - grafana_key_fpr.stdout | upper == grafana_apt_key_fingerprint | upper
    fail_msg: >-
      grafana apt key fingerprint {{ grafana_key_fpr.stdout }} != pinned
      {{ grafana_apt_key_fingerprint }} — set grafana_apt_key_fingerprint from
      Grafana's published docs (not from the downloaded key) or investigate.

- name: Install python3-debian (deb822_repository needs it on the target)
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Add grafana apt repository
  ansible.builtin.deb822_repository:
    name: grafana
    types: deb
    uris: "{{ grafana_apt_uri }}"
    suites: stable
    components: main
    signed_by: /etc/apt/keyrings/grafana.gpg
    state: present

- name: Install grafana {{ grafana_version }}
  ansible.builtin.apt:
    name: "grafana={{ grafana_version }}"
    state: present
    update_cache: true

- name: Hold grafana at the pinned version
  ansible.builtin.dpkg_selections:
    name: grafana
    selection: hold

- name: Grafana data directory on the data volume
  ansible.builtin.file:
    path: "{{ monitoring_data_dir }}/grafana"
    state: directory
    owner: grafana
    group: grafana
    mode: "0750"

- name: Grafana config (private listener, no anonymous, no sign-up)
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana

- name: Provision the Prometheus datasource
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana

- name: Enable and start grafana
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started

# --- tenderduty ---

- name: Install docker — Debian's docker.io, apt-signed, no third-party repo
  ansible.builtin.apt:
    name: docker.io
    state: present

- name: Enable and start tenderduty
  ansible.builtin.systemd:
    name: tenderduty
    enabled: true
    state: started
    daemon_reload: true
