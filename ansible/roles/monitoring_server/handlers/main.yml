---
- name: Restart prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: restarted
    daemon_reload: true

- name: Reload prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: reloaded

- name: Restart alertmanager
  ansible.builtin.systemd:
    name: alertmanager
    state: restarted
    daemon_reload: true

- name: Restart grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted

- name: Restart tenderduty
  ansible.builtin.systemd:
    name: tenderduty
    state: restarted
    daemon_reload: true
