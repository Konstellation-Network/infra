---
# Runs on every node (validator, sentry, rpc, archive). CometBFT already
# exposes chain metrics on prometheus_port (ansible/roles/node); this role
# adds node_exporter for host-level metrics — disk headroom, CPU, network —
# which is where "no new blocks" often traces back to (ENGINEERING.md §9.2).

- name: Fail if node_exporter_sha256 is unset
  ansible.builtin.assert:
    that:
      - node_exporter_sha256 | length > 0
    fail_msg: "node_exporter_sha256 must be set — never install unverified."

- name: Create node_exporter system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Root-owned download cache (never /tmp — a pre-existing file there could be swapped between download and extract)
  ansible.builtin.file:
    path: /var/cache/konstellation
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Download node_exporter, verify sha256
  ansible.builtin.get_url:
    url: "{{ node_exporter_release_url }}"
    dest: /var/cache/konstellation/node_exporter.tar.gz
    force: true  # always re-fetch into the root-only cache; the checksum below is what gates extraction
    owner: root
    group: root
    checksum: "sha256:{{ node_exporter_sha256 }}"
    mode: "0644"

- name: Re-verify the cached tarball immediately before extracting as root
  ansible.builtin.stat:
    path: /var/cache/konstellation/node_exporter.tar.gz
    checksum_algorithm: sha256
  register: node_exporter_tarball

- name: Fail if the tarball changed between download and extract
  ansible.builtin.assert:
    that:
      - node_exporter_tarball.stat.checksum == node_exporter_sha256
    fail_msg: "node_exporter tarball checksum mismatch at extract time — refusing."

- name: Extract node_exporter binary
  ansible.builtin.unarchive:
    src: /var/cache/konstellation/node_exporter.tar.gz
    dest: /usr/local/bin
    remote_src: true
    extra_opts:
      - "--strip-components=1"
      - "node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    owner: root
    group: root
    mode: "0755"

- name: Install node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter.service
    enabled: true
    state: started
    daemon_reload: true
