---
konstellation_user: konstellation
konstellation_group: konstellation
chain_id: testnet-1
horcrux_version: "v3.3.0"
horcrux_sha256: ""
# v3.x releases ship a bare binary per arch plus horcrux_sha256.txt (gh api,
# 2026-09-21) — no tarball. Take the sha256 from that file.
horcrux_release_url: "https://github.com/strangelove-ventures/horcrux/releases/download/{{ horcrux_version }}/horcrux_linux-amd64"
horcrux_home: /home/konstellation/.horcrux
horcrux_threshold: 2
horcrux_shares: 3

# colocated (testnet-1 default) — this role runs on the validator hosts;
#            one instance per host, cosigner list filled in by hand.
# dedicated  — this role runs on the `cosigners` group; one instance per
#            validator on every cosigner host, cosigner list built from the
#            inventory. terraform/envs/<net> var.horcrux_mode.
horcrux_mode: colocated

# The port the validator's config.toml priv_validator_laddr listens on and
# every cosigner dials (ansible/roles/node sets the listener when
# horcrux_enabled is true on that validator).
horcrux_privval_port: 1234
# Dedicated mode: instance i (validator order in the inventory) uses
# p2p port base+i on every cosigner host, so the same instance name maps to
# the same port fleet-wide.
horcrux_p2p_base_port: 2222
# Prometheus metrics (horcrux debugAddr), base+i like the p2p port; scraped
# by the monitoring host only (ufw, roles/firewall).
horcrux_debug_base_port: 8453
horcrux_grpc_timeout: 1000ms
horcrux_raft_timeout: 1000ms
horcrux_unit_path: /etc/systemd/system/horcrux@.service
horcrux_render_only: false
