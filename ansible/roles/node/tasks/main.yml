---
# Installs konstellationd from a pinned, checksummed release build only —
# never built on the host (ENGINEERING.md §2.6: all release binaries come
# from CI in the konstellation repo). This role fails closed if the version
# pin or checksum vars are empty rather than silently skip verification.

# First, before anything changes on the host: a validator waiting on a
# remote signer that this network does not have would never sign again.
- name: Fail if a validator is set to wait for a remote signer that this network does not have
  when: node_role == 'validator'
  ansible.builtin.assert:
    that:
      - not (horcrux_enabled | bool) or horcrux_mode in ['colocated', 'dedicated']
    fail_msg: >-
      horcrux_enabled is true but horcrux_mode={{ horcrux_mode }}: no cosigner
      would ever connect to priv_validator_laddr and the validator would stop
      signing. On devnet-1 the validator signs with its own key.

# A host in several role groups (devnet-1 on Contabo) gets node_role from
# whichever group_vars file sorts last unless the inventory pins it per
# host. The node role keys peers and signing on it, so it must name a chain
# role — e.g. the archive+monitoring host must say `archive`, not
# `monitoring`.
- name: Fail if node_role is not a chain-node role
  ansible.builtin.assert:
    that:
      - node_role in ['validator', 'sentry', 'rpc', 'archive']
    fail_msg: >-
      node_role={{ node_role }} on a chain node: set node_role in the
      inventory for a host that is in several groups (hosts.yml host vars).

# single_disk (devnet-1 on Contabo): chain data lives on the root disk with
# the key. A host cannot be both — tasks/state_guard.yml explains which
# guard applies when.
- name: Fail if a single-disk host also declares a data volume
  when: single_disk | bool
  ansible.builtin.assert:
    that:
      - data_volume_device | default('') | length == 0
      - local_ssd_count | default(0) | int == 0
    fail_msg: "single_disk is true but data_volume_device/local_ssd_count are set — pick one layout."

- name: Fail if konstellationd_version/sha256 are unset
  ansible.builtin.assert:
    that:
      - konstellationd_version | length > 0
      - konstellationd_sha256 | length > 0
    fail_msg: >-
      konstellationd_version and konstellationd_sha256 must be set (see
      group_vars/all.yml) before this role can run. Get them from the
      release checklist in the networks repo — never guess a checksum.

- name: Create konstellation group
  ansible.builtin.group:
    name: "{{ konstellation_group }}"
    system: true

- name: Create konstellation user
  ansible.builtin.user:
    name: "{{ konstellation_user }}"
    group: "{{ konstellation_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "/home/{{ konstellation_user }}"
    create_home: true

- name: Create daemon home and cosmovisor directory tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ konstellation_user }}"
    group: "{{ konstellation_group }}"
    mode: "0750"
  loop:
    - "{{ daemon_home }}"
    - "{{ daemon_home }}/config"
    - "{{ daemon_home }}/cosmovisor"
    - "{{ daemon_home }}/cosmovisor/genesis/bin"
    - "{{ daemon_home }}/cosmovisor/upgrades"

# --- data volume: a single attached disk (Hetzner/GCP archive nodes) ---

- name: Mount attached data volume, if this host has one
  when: data_volume_device is defined and data_volume_device | length > 0
  block:
    - name: Read the data volume's existing filesystem type, if any
      ansible.builtin.command:
        cmd: blkid -o value -s TYPE {{ data_volume_device }}
      register: data_volume_fstype
      changed_when: false
      failed_when: false  # blkid exits 2 for "no filesystem", which is an answer, not an error

    - name: Refuse to format the data volume under an existing validator key (tasks/data_guard.yml)
      ansible.builtin.import_tasks: data_guard.yml
      vars:
        data_guard_device: "{{ data_volume_device }}"
        data_guard_intact: "{{ data_volume_fstype.stdout | trim | length > 0 }}"

    - name: Format data volume (only if it has no filesystem yet)
      community.general.filesystem:
        fstype: ext4
        dev: "{{ data_volume_device }}"

    - name: Mount data volume under daemon_home {{ daemon_home }}
      ansible.posix.mount:
        path: "{{ daemon_home }}/data"
        src: "{{ data_volume_device }}"
        fstype: ext4
        opts: defaults,nofail
        state: mounted

    - name: Fix ownership of mounted data dir
      ansible.builtin.file:
        path: "{{ daemon_home }}/data"
        owner: "{{ konstellation_user }}"
        group: "{{ konstellation_group }}"
        mode: "0750"

# --- data volume: striped GCP validator Local SSDs ---
#
# terraform/modules/gcp/validator attaches local_ssd_count NVMe-interface
# Local SSDs (375 GiB each — GCP's fixed increment); a single one doesn't
# meet ENGINEERING.md §9.2's multi-TB spec, so they're striped into one RAID0
# array. See that module's local_ssd_count variable for the ephemerality /
# double-sign-risk caveat this depends on. tasks/data_guard.yml refuses to
# recreate the array under an existing validator key; roles/cosmovisor's
# unit refuses to start on an unmounted data dir. Between them a lost Local
# SSD is a page, never a node signing from height 0.

- name: Stripe and mount GCP validator Local SSDs, if this host has any
  when: local_ssd_count | default(0) > 0
  block:
    - name: Install mdadm
      ansible.builtin.apt:
        name: mdadm
        state: present
        update_cache: true

    - name: Build list of Local SSD device paths
      ansible.builtin.set_fact:
        local_ssd_devices: >-
          {{ range(0, local_ssd_count) | map('string')
             | map('regex_replace', '^(.*)$', '/dev/disk/by-id/google-local-nvme-ssd-\1')
             | list }}

    - name: Check for an existing RAID array
      ansible.builtin.stat:
        path: /dev/md0
      register: raid_array

    - name: Refuse to recreate the array under an existing validator key (tasks/data_guard.yml)
      ansible.builtin.import_tasks: data_guard.yml
      vars:
        data_guard_device: /dev/md0
        data_guard_intact: "{{ raid_array.stat.exists }}"

    - name: Create RAID0 array across Local SSDs
      when: not raid_array.stat.exists
      ansible.builtin.command:
        cmd: >-
          mdadm --create /dev/md0 --level=0
          --raid-devices={{ local_ssd_count }} {{ local_ssd_devices | join(' ') }}
        creates: /dev/md0

    - name: Read current RAID array definition
      ansible.builtin.command: mdadm --detail --scan
      register: mdadm_scan
      changed_when: false

    - name: Persist RAID array assembly across reboots
      ansible.builtin.lineinfile:
        path: /etc/mdadm/mdadm.conf
        line: "{{ mdadm_scan.stdout }}"
        create: true
        mode: "0644"
      notify: Rebuild initramfs

    - name: Format RAID array (only if it has no filesystem yet)
      community.general.filesystem:
        fstype: ext4
        dev: /dev/md0

    - name: Mount RAID array under daemon_home {{ daemon_home }}
      ansible.posix.mount:
        path: "{{ daemon_home }}/data"
        src: /dev/md0
        fstype: ext4
        opts: defaults,nofail
        state: mounted

    - name: Fix ownership of mounted RAID data dir
      ansible.builtin.file:
        path: "{{ daemon_home }}/data"
        owner: "{{ konstellation_user }}"
        group: "{{ konstellation_group }}"
        mode: "0750"

# --- single disk: no volume to guard; guard the signing state instead ---

- name: Single disk — the data volume and mount guards do not apply here
  when: single_disk | bool and node_role == 'validator'
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: single_disk — key, signing state and chain data
      share one disk, so a lost disk loses all three (downtime, never height 0
      under a surviving key). data_guard.yml and the cosmovisor mount guard are
      skipped; tasks/state_guard.yml checks the key still has its state file.

- name: Refuse a validator key without its signing state (tasks/state_guard.yml)
  when: single_disk | bool and node_role == 'validator'
  ansible.builtin.import_tasks: state_guard.yml

# --- binary ---

- name: Download and verify konstellationd {{ konstellationd_version }}
  ansible.builtin.get_url:
    url: "{{ konstellationd_release_url }}"
    dest: "{{ daemon_home }}/cosmovisor/genesis/bin/{{ daemon_name }}"
    checksum: "sha256:{{ konstellationd_sha256 }}"
    owner: "{{ konstellation_user }}"
    group: "{{ konstellation_group }}"
    mode: "0755"

- name: Point cosmovisor current at genesis on first install only (tasks/link.yml)
  ansible.builtin.import_tasks: link.yml

# --- genesis (idempotent: only runs `init` if config.toml doesn't exist yet) ---

- name: Run konstellationd init to scaffold config
  become: true
  become_user: "{{ konstellation_user }}"
  ansible.builtin.command:
    cmd: >-
      {{ daemon_home }}/cosmovisor/genesis/bin/{{ daemon_name }} init {{ inventory_hostname }}
      --chain-id {{ chain_id }}
      --default-denom {{ base_denom }}
      --home {{ daemon_home }}
    creates: "{{ daemon_home }}/config/config.toml"
  environment:
    DAEMON_HOME: "{{ daemon_home }}"
    DAEMON_NAME: "{{ daemon_name }}"

- name: Fetch real genesis.json, verify sha256 (overrides init's placeholder)
  when: genesis_url | length > 0
  ansible.builtin.get_url:
    url: "{{ genesis_url }}"
    dest: "{{ daemon_home }}/config/genesis.json"
    checksum: "sha256:{{ genesis_sha256 }}"
    owner: "{{ konstellation_user }}"
    group: "{{ konstellation_group }}"
    mode: "0644"
  notify: Restart cosmovisor

# --- config ---
#
# `konstellationd init` (above) already writes a correct, complete
# config.toml/app.toml/client.toml — that is the entire point of the
# app/cmd/konstellationd/cmd/init.go work in the konstellation repo
# (STATUS.md §3: the old local_node.sh jq/sed patching is gone specifically
# because init is now trusted to get this right). Ansible's job is to
# reconcile the small set of keys that are environment-specific (peers,
# pruning, whether this host is public), not to regenerate the files from a
# template — a from-scratch template here would silently drift from whatever
# `init` produces and reintroduce the exact class of bug that was removed.

- name: Wire peers from the inventory (tasks/peers.yml)
  ansible.builtin.import_tasks: peers.yml

- name: Reconcile config.toml [p2p]
  community.general.ini_file:
    path: "{{ daemon_home }}/config/config.toml"
    section: p2p
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    owner: "{{ konstellation_user }}"
    group: "{{ konstellation_group }}"
    mode: "0644"
  loop:
    - { option: "pex", value: "{{ pex | lower }}" }
    - { option: "seeds", value: '"{{ seeds }}"' }
    - { option: "persistent_peers", value: '"{{ p2p_persistent_peers }}"' }
    - { option: "private_peer_ids", value: '"{{ p2p_private_peer_ids }}"' }
  notify: Restart cosmovisor

# priv_validator_laddr is a top-level key in config.toml (no section).
# Colocated horcrux talks over loopback; dedicated cosigners dial the
# private IP (cloud firewall + ufw admit only the cosigner IPs on 1234).
- name: Reconcile config.toml priv_validator_laddr (horcrux remote signer) — validators
  when: node_role == 'validator'
  community.general.ini_file:
    path: "{{ daemon_home }}/config/config.toml"
    section: null
    option: priv_validator_laddr
    value: '"{{ ("tcp://" ~ ("127.0.0.1" if horcrux_mode == "colocated" else ansible_host) ~ ":" ~ horcrux_privval_port) if horcrux_enabled else "" }}"'
    owner: "{{ konstellation_user }}"
    group: "{{ konstellation_group }}"
    mode: "0644"
  notify: Restart cosmovisor

# CometBFT RPC: init writes tcp://127.0.0.1:26657. Validators keep that;
# sentries/rpc/archive bind 0.0.0.0 so tenderduty (monitoring host), the
# public RPC and Blockscout can reach them — reachability is then the cloud
# firewall + ufw (26657 on sentries: monitoring host only). Found in review:
# tenderduty had nothing to talk to and the "public RPC node" served only
# JSON-RPC.
- name: Reconcile config.toml [rpc] laddr
  community.general.ini_file:
    path: "{{ daemon_home }}/config/config.toml"
    section: rpc
    option: laddr
    value: '"tcp://{{ rpc_bind_address }}:26657"'
    owner: "{{ konstellation_user }}"
    group: "{{ konstellation_group }}"
    mode: "0644"
  notify: Restart cosmovisor

- name: Reconcile config.toml [instrumentation]
  community.general.ini_file:
    path: "{{ daemon_home }}/config/config.toml"
    section: instrumentation
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    owner: "{{ konstellation_user }}"
    group: "{{ konstellation_group }}"
    mode: "0644"
  loop:
    - { option: "prometheus", value: "{{ prometheus_enabled | lower }}" }
    - { option: "prometheus_listen_addr", value: '":{{ prometheus_port }}"' }
  notify: Restart cosmovisor

- name: Reconcile config.toml [mempool] (Krakatoa app-side mempool, ENGINEERING.md §7.3/D13)
  community.general.ini_file:
    path: "{{ daemon_home }}/config/config.toml"
    section: mempool
    option: type
    value: '"{{ mempool_type }}"'
    owner: "{{ konstellation_user }}"
    group: "{{ konstellation_group }}"
    mode: "0644"
  notify: Restart cosmovisor

- name: Reconcile app.toml [pruning]
  community.general.ini_file:
    path: "{{ daemon_home }}/config/app.toml"
    section: null
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    owner: "{{ konstellation_user }}"
    group: "{{ konstellation_group }}"
    mode: "0644"
  loop:
    - { option: "pruning", value: '"{{ pruning }}"' }
    - { option: "pruning-keep-recent", value: '"{{ pruning_keep_recent }}"' }
    - { option: "pruning-interval", value: '"{{ pruning_interval }}"' }
  when: pruning != "default"
  notify: Restart cosmovisor

- name: Reconcile app.toml [api] (REST on 1317 — rpc and archive nodes only)
  community.general.ini_file:
    path: "{{ daemon_home }}/config/app.toml"
    section: api
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    owner: "{{ konstellation_user }}"
    group: "{{ konstellation_group }}"
    mode: "0644"
  loop:
    - { option: "enable", value: "{{ api_enabled | lower }}" }
    - { option: "address", value: '"tcp://{{ rpc_bind_address }}:1317"' }
  notify: Restart cosmovisor

# Node-local mempool floor, not a protocol parameter (TOKENOMICS.md §3: no
# protocol floor, base fee may decay to 0). init writes 0esp; the public
# RPC node sets a floor in group_vars/rpc.yml so its open mempool is not a
# free spam target.
- name: Reconcile app.toml minimum-gas-prices
  community.general.ini_file:
    path: "{{ daemon_home }}/config/app.toml"
    section: null
    option: minimum-gas-prices
    value: '"{{ minimum_gas_prices }}"'
    owner: "{{ konstellation_user }}"
    group: "{{ konstellation_group }}"
    mode: "0644"
  notify: Restart cosmovisor

- name: Reconcile app.toml [json-rpc]
  when: jsonrpc_enabled
  community.general.ini_file:
    path: "{{ daemon_home }}/config/app.toml"
    section: json-rpc
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    owner: "{{ konstellation_user }}"
    group: "{{ konstellation_group }}"
    mode: "0644"
  loop:
    - { option: "enable", value: "true" }
    - { option: "api", value: '"eth,net,web3,txpool{{ ",debug" if evm_tracer_enabled else "" }}"' }
    - { option: "address", value: '"{{ jsonrpc_bind_address }}:{{ jsonrpc_port }}"' }
    - { option: "ws-address", value: '"{{ jsonrpc_bind_address }}:{{ jsonrpc_ws_port }}"' }
    # cosmos/evm: "SHOULD NOT be used on public tracing nodes" — pinned off
    # even though it is the default, so a future default flip cannot open it.
    - { option: "enable-profiling", value: "false" }
  notify: Restart cosmovisor

# app.toml's evm-chain-id is intentionally NOT set here: app/config.ValidateEVMChainID
# in the konstellation binary itself reconciles it from genesis on every start
# (ENGINEERING.md §1's chain-id invariant) and refuses to boot on a mismatch. A
# playbook that also wrote this value would be a second source of truth for the
# exact thing that invariant exists to prevent.
