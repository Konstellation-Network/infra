---
node_role: archive

pex: true
pruning: "nothing"

# Blockscout needs debug_traceTransaction (ENGINEERING.md §6.5) — tracing must
# be on, and this must stay off the public internet (§5.2 invariant).
evm_tracer_enabled: true
public_ip: false

jsonrpc_enabled: true
# devnet-1 on Contabo: the archive's only address is PUBLIC, so nothing it
# serves binds to it. JSON-RPC/WS (with debug_*), CometBFT RPC and REST all
# stay on loopback; ufw would block them anyway, but a debug JSON-RPC that
# listens only on 127.0.0.1 cannot be exposed by a firewall mistake. The
# explorer (Blockscout) and faucet will run on this same host (server 3):
# when they land, give their containers host networking or bind these to
# the docker bridge address — never to the public IP, and note that ports
# docker PUBLISHES bypass ufw entirely.
jsonrpc_bind_address: "127.0.0.1"
rpc_bind_address: "127.0.0.1"
api_enabled: true
# roles/firewall still requires a source list for the archive's 26657
# (asserted non-empty, /24 or narrower): the monitoring host, which is this
# host itself on devnet-1. With the loopback binds above it opens nothing.
archive_rpc_allowed_cidrs:
  - "{{ monitoring_host_private_ip }}/32"
# REST (1317) and the debug-enabled JSON-RPC (8545-8546) from other hosts:
# none — the explorer will be local.
archive_explorer_cidrs: []
