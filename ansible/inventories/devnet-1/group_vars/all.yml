---
# Shared across every node in devnet-1 — the dapp-developer network (D18,
# decided 2026-09-29). Values mirror ENGINEERING.md §1: devnet-1 / EIP-155
# 56672. Everything not set here is the same as testnet-1 on purpose.

chain_id: devnet-1
evm_chain_id: 56672
bech32_prefix: kons
base_denom: esp
denom_display: KASH

daemon_name: konstellationd
daemon_home: /home/konstellation/.konstellationd

# devnet-1 runs the MAINNET binary version (D18): dapp developers must build
# against exactly what konstellation-1 runs. Pin the same release as
# konstellation-1 — not testnet-1's, which runs ahead to rehearse upgrades.
# Fill from the release checklist (ENGINEERING.md §16) once a build exists.
konstellationd_version: ""
konstellationd_sha256: ""

# Krakatoa app-side mempool (ENGINEERING.md §11 D13): same as every network.
mempool_type: app

prometheus_enabled: true
prometheus_port: 26660

# --- The Contabo shape (founder decision, 2026-09-30; README "devnet-1") ---
# Three hand-ordered VPSes, each with one public IPv4 and one disk. The
# addresses live in hosts.yml (hand-written from hosts.yml.example; no
# OpenTofu). These are the properties of the shape, not of the addresses:
cloud: contabo
# No private network: every address in hosts.yml is public, roles/firewall
# admits internal ports from exact /32s only, and no host NATs or routes.
private_network: false
# Chain data on the root disk, next to the key: roles/node swaps the
# data-volume guards for tasks/state_guard.yml (ENGINEERING.md §2.7).
single_disk: true
# One validator signing with its own priv_validator_key.json: no Horcrux
# hosts or instances. site.yml skips both horcrux plays.
horcrux_mode: none
# One provider: no site-to-site WireGuard tunnel (site.yml skips
# roles/wireguard); the bastion role does not forward packets.
cross_cloud_tunnel: false
# No seed node on devnet-1: the archive (server 3) peers with the sentry
# (server 2) directly, node ids read after init (roles/node/tasks/peers.yml).
peer_non_validators_with_sentries: true

# --- Alert routing (ansible/roles/monitoring_server): placeholders until
# the on-call rota exists (ENGINEERING.md §17, runbooks/on-call.md). Set
# from a vault file, never in plain text here. devnet-1 halting is a page
# for dapp developers, not for users' funds — route it lower than
# testnet-1/mainnet if the rota distinguishes. ---
alert_pagerduty_routing_key: ""
alert_slack_webhook_url: ""
alert_webhook_url: ""
