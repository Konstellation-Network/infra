---
node_role: sentry
# devnet-1 on Contabo: the one sentry is also the public RPC node (server
# 2, see rpc.yml). The keys both files set must stay identical.

pex: true
# private_peer_ids (the validator's node id, never gossiped) and
# persistent_peers (every other sentry — none with the default single
# sentry) are computed by roles/node/tasks/peers.yml; set here/in host_vars
# only to override.
private_peer_ids: ""
persistent_peers: ""

pruning: custom
pruning_keep_recent: "100"
pruning_interval: "10"

public_ip: true
# CometBFT RPC bound on all interfaces: tenderduty (monitoring host) queries
# it, and on devnet-1 this host is the public RPC node too (26657 public).
rpc_bind_address: "0.0.0.0"
