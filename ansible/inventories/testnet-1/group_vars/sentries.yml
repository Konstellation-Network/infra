---
node_role: sentry

pex: true
# private_peer_ids: the shielded validator's node ID, so it's never gossiped
# over pex. Per-host — set in host_vars, one value per sentry.
private_peer_ids: ""

pruning: custom
pruning_keep_recent: "100"
pruning_interval: "10"

public_ip: true
# CometBFT RPC bound on all interfaces so tenderduty (monitoring host) can
# query it; the cloud firewall + ufw admit 26657 from the monitoring host only.
rpc_bind_address: "0.0.0.0"
