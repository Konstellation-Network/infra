---
node_role: validator

pex: false
# persistent_peers is per-host: each validator's own sentry only. Set in
# host_vars or generated by terraform's inventory output (see
# terraform/envs/testnet-1/inventory.tpl.yml) once sentry node IDs are known.
persistent_peers: ""

pruning: custom
pruning_keep_recent: "100"
pruning_interval: "10"

public_ip: false

# Remote signing via horcrux. Off until the key ceremony has happened for
# this validator — then flip it in host_vars for that validator only (see
# ansible/roles/node/defaults/main.yml and runbooks/validator-key-rotation.md).
horcrux_enabled: false
