---
# Shared across every node in testnet-1. Values here mirror ENGINEERING.md §1/§2/§3.

chain_id: testnet-1
evm_chain_id: 56671
bech32_prefix: kons
base_denom: esp
denom_display: KASH

daemon_name: konstellationd
daemon_home: /home/konstellation/.konstellationd

# Filled in from the release checklist (ENGINEERING.md §16) once a build exists.
# Never trust an unpinned version here — see ansible/roles/node/tasks/main.yml.
konstellationd_version: ""
konstellationd_sha256: ""

# Krakatoa app-side mempool (ENGINEERING.md §11 D13 — decided 2026-09-14: keep
# ON; cosmos/evm v0.7 default, `konstellationd init` writes it). Flip here
# fleet-wide if that ever changes, not per host.
mempool_type: app

prometheus_enabled: true
prometheus_port: 26660

# Per-host network facts — bastion_private_ip, network_cidr, cloud — and the
# fleet-wide ones — fleet_cidrs, monitoring_host_private_ip, horcrux_mode,
# wireguard_* — are NOT set here: terraform writes them into hosts.yml
# (terraform/envs/testnet-1/outputs.tf + inventory.tpl.yml) so ansible and
# the cloud firewalls can never disagree about them.

# --- Alert routing (ansible/roles/monitoring_server): placeholders until
# the on-call rota exists (ENGINEERING.md §17, runbooks/on-call.md). Set
# from a vault file, never in plain text here. ---
alert_pagerduty_routing_key: ""
alert_slack_webhook_url: ""
alert_webhook_url: ""
