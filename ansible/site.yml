---
# Full fleet configuration. Idempotent — safe to re-run. Does not touch key
# material (horcrux shards, priv_validator_key.json, WireGuard private keys
# beyond generating one in place on first run); see ansible/roles/horcrux
# and ansible/roles/wireguard.
#
# Order matters: bastions first — every other host is only reachable
# through them (ssh_config ProxyJump), and on Hetzner the private-only hosts
# have no internet until the bastion's NAT is up. devnet-1 (Contabo, hand-
# ordered VPSes) runs bootstrap.yml once per fresh server before this; its
# bastion is server 2, which is also the sentry and public RPC node, so it
# appears in the bastions play and again in chain_nodes (roles/firewall
# applies the union of its roles' rules both times).
#
# Usage:
#   ansible-playbook site.yml --limit bastions       # first, always
#   ansible-playbook site.yml --limit validators     # one group at a time is safer
#   ansible-playbook site.yml                        # whole fleet

- name: Configure bastions (jump hosts, NAT egress, cross-cloud tunnel where there are two clouds)
  hosts: bastions
  become: true
  roles:
    - firewall
    - bastion
    # both bastions must be in the play: they exchange public keys as facts.
    # Single-provider networks (devnet-1 on Contabo) have one bastion and no
    # tunnel; their group_vars set cross_cloud_tunnel: false. Absent = true, so a two-cloud
    # inventory that forgets it still fails closed in the role's asserts.
    - role: wireguard
      when: cross_cloud_tunnel | default(true) | bool
    - monitoring # node_exporter

- name: Configure all chain nodes (validators, sentries, rpc, archive)
  hosts: chain_nodes
  become: true
  roles:
    - firewall
    - node
    - cosmovisor
    - monitoring

# horcrux_mode (terraform's inventory output): colocated | dedicated run one
# of the two plays below; none (devnet-1: one validator, its own
# priv_validator_key.json) runs neither.
- name: Configure horcrux cosigners — colocated mode, on the validator hosts
  hosts: validators
  become: true
  roles:
    - role: horcrux
      when: horcrux_mode == 'colocated'

- name: Configure horcrux cosigners — dedicated mode, separate hosts
  hosts: cosigners
  become: true
  roles:
    - firewall
    - monitoring
    - role: horcrux
      when: horcrux_mode == 'dedicated'

- name: Configure the monitoring host — prometheus, alertmanager, grafana, tenderduty
  hosts: monitoring
  become: true
  roles:
    - firewall
    - monitoring
    - monitoring_server
