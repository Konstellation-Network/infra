# Alert rules for testnet-1, per ENGINEERING.md §9.2: "Alert on missed blocks,
# falling peer count, block-time drift, disk headroom, and no new blocks — the
# last is the exploit tripwire."
#
# Assumes a central Prometheus scraping every node's CometBFT metrics
# (instrumentation.prometheus_listen_addr, set by ansible/roles/node) and
# node_exporter (ansible/roles/monitoring) on the private network.
# tenderduty (ansible/roles/monitoring_server) does validator-specific paging
# (missed blocks, jailed, stalled) — these rules are the Prometheus/
# Alertmanager side only. Deployed verbatim to the monitoring host by
# ansible/roles/monitoring_server (promtool check rules on the way).
#
# CAVEAT: metric names below (cometbft_consensus_*) are CometBFT's documented
# convention but have NOT been confirmed against a live node's /metrics yet —
# no node exists to scrape. Verify against the real output before relying on
# these in a drill; a metric rename between cometbft versions is the likeliest
# way this file goes stale silently.

groups:
  - name: konstellation-chain
    rules:
      # The tripwire. Any node — validator or full node — producing no new
      # blocks for 3 minutes is either dead, forked, or the exploit scenario
      # ENGINEERING.md §4.2 is written around.
      - alert: NoNewBlocks
        expr: increase(cometbft_consensus_height[3m]) == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} has produced no new blocks in 3 minutes"
          runbook: infra/runbooks/emergency-halt.md

      - alert: ValidatorMissedBlocks
        expr: increase(cometbft_consensus_validator_missed_blocks[10m]) > 5
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} missed more than 5 blocks in the last 10 minutes"
          runbook: infra/runbooks/validator-key-rotation.md

      # missed_blocks only counts while the validator is in LastValidators:
      # a JAILED validator raises nothing there. This does — its last signed
      # height stops moving while the chain's height does not (review,
      # 2026-09-21). Scraped on the validator itself (validator_address is
      # its own), so also covers a validator whose signer (horcrux) is stuck.
      - alert: ValidatorNotSigning
        expr: |
          (cometbft_consensus_height{role="validator"} - on(instance) cometbft_consensus_validator_last_signed_height{role="validator"}) > 20
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} has not signed for more than 20 blocks — jailed, key/horcrux stuck, or partitioned"
          runbook: infra/runbooks/validator-key-rotation.md

      # The active set changed: a validator jailed/unbonded or admitted
      # (D16) — either way a human should know within minutes.
      - alert: ValidatorSetChanged
        expr: changes(cometbft_consensus_validators[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "the active validator set size changed in the last 10 minutes (now {{ $value }} on {{ $labels.instance }})"
          runbook: infra/runbooks/validator-admission.md

      # Dedicated horcrux: a cosigner instance whose metrics vanish is a
      # shard out of the cluster; two gone is that validator halted.
      - alert: CosignerDown
        expr: up{job="horcrux"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "horcrux instance for {{ $labels.validator }} on {{ $labels.instance }} is not answering — one shard out of the 2-of-3 cluster"
          runbook: infra/runbooks/validator-key-rotation.md

      - alert: FallingPeerCount
        expr: cometbft_p2p_peers < 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} has fewer than 2 peers"

      # Expected block time is ~1.5 s (ENGINEERING.md §18 blocks_per_year
      # estimate), i.e. ~0.67 blocks/s. Page when the observed rate falls
      # below half of that — 0.33 blocks/s, a 3 s block time — for 10 min.
      # Re-derive the threshold from testnet-1's measured block time when
      # blocks_per_year is (§18); an earlier version assumed 1 block/min
      # and would have fired forever.
      - alert: BlockTimeDrift
        expr: |
          rate(cometbft_consensus_height[5m]) > 0 and rate(cometbft_consensus_height[5m]) < 0.33
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is producing blocks at less than half the expected ~0.67/s rate (block time > 3 s)"

      - alert: DiskHeadroomLow
        expr: node_filesystem_avail_bytes{mountpoint=~"/|/home.*|/var/lib/monitoring"} / node_filesystem_size_bytes{mountpoint=~"/|/home.*|/var/lib/monitoring"} < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} has less than 15% disk headroom on {{ $labels.mountpoint }}"

      - alert: DiskHeadroomCritical
        expr: node_filesystem_avail_bytes{mountpoint=~"/|/home.*|/var/lib/monitoring"} / node_filesystem_size_bytes{mountpoint=~"/|/home.*|/var/lib/monitoring"} < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} has less than 5% disk headroom on {{ $labels.mountpoint }} — IAVL commits will start failing"

      - alert: NodeDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus can't scrape {{ $labels.instance }}"

      # Every node_exporter target in one cloud unreachable at once is not
      # N dead hosts: it is the bastions' WireGuard tunnel (README.md
      # "Cross-cloud connectivity") or that cloud's network. Validator<->
      # sentry p2p never crosses the tunnel, BUT in dedicated horcrux mode
      # the cosigners do (STATUS §5a P22): the far cloud's cosigner is
      # partitioned from the other two, and every validator whose signing
      # cluster just lost its quorum path stops signing — with 5 of 10
      # validators per cloud that is a chain halt within seconds. Treat as
      # a halt in progress until proven otherwise.
      - alert: CloudUnreachable
        expr: |
          count by (cloud) (up{job="node-exporter", cloud!=""} == 0)
            == count by (cloud) (up{job="node-exporter", cloud!=""})
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "every host in cloud {{ $labels.cloud }} is unreachable from the monitoring host — tunnel or cloud outage; DEDICATED HORCRUX MODE: chain halt imminent (cosigner partitioned, P22)"
          runbook: infra/runbooks/emergency-halt.md

      # The pager itself. tenderduty's /metrics gone for 5 minutes means
      # validator paging is silently off.
      - alert: TenderdutyDown
        expr: up{job="tenderduty"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "tenderduty is not running — validator paging is off"
          runbook: infra/runbooks/on-call.md
